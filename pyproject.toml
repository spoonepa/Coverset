[project]
name = "coverset"
version = "0.1.0"
description = "An agentic scheduling partner for first assistant directors."
readme = "README.md"
authors = [
    { name = "Suresh Poonepalle", email = "spoonepa@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "fastapi>=0.141.1",
    "google-cloud-storage>=3.0",
    "google-cloud-tasks>=2.20.0",
    "google-genai>=2.20.0",
    "ortools>=9.15.6755",
    "parallel-web>=1.3.0",
    "psycopg[binary]>=3.2",
    "pypdf>=6.4.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = "-q -m 'not live and not corpus'"
markers = [
    "req(*ids): requirement IDs from SPEC.md that this test verifies",
    "live: hits the real Parallel API; needs PARALLEL_API_KEY. Deselected by default.",
    "corpus: downloads real screenplays from configured URLs. Deselected by default.",
]
