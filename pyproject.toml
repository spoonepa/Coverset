[project]
name = "coverset"
version = "0.1.0"
description = "An agentic scheduling partner for first assistant directors."
readme = "README.md"
authors = [
    { name = "Suresh Poonepalle", email = "spoonepa@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "parallel-web>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "req(*ids): requirement IDs from SPEC.md that this test verifies",
    "live: hits the real Parallel API; needs PARALLEL_API_KEY. Deselected by default.",
]
